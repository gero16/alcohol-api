services:
  db:
    image: postgres:16-alpine
    container_name: alcoholes-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: holanda
      POSTGRES_DB: alcohol_postgre
    ports:
      - "5432:5432"
    volumes:
      - alcoholes_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d alcohol_postgre"]
      interval: 3s
      timeout: 5s
      retries: 10

volumes:
  alcoholes_pg_data:
